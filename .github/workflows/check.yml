name: Check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run smoke
      - run: npm run smoke:archive
        timeout-minutes: 2
      - run: npm run probe:live
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 1
      - run: npm run browser:live
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitcorn-demo-preview
          path: bitcorn-demo.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && always()
        with:
          name: live-market-probe
          path: live-probe.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && always()
        with:
          name: browser-live-probe
          path: |
            live-browser-report.json
            kraken-live-preview.png
            binance-spot-live-preview.png
            coinbase-live-preview.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitcorn-liquidity-replay
          path: |
            bitcorn-liquidity-replay.png
            bitcorn-open-terminal.png
            bitcorn-drawings.png
          if-no-files-found: ignore
